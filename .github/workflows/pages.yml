name: Validate and publish handbook

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-authoring.txt

      - name: Install GIS verification dependency
        run: pip install -r teaching-data/contested-models/requirements-gis.txt

      - name: Verify pinned GIS coordinates
        run: python teaching-data/contested-models/prepare_georeferencing.py --check

      - name: Rebuild scholarly-work teaching samples
        run: make scholarly-work-samples

      - name: Rebuild archival-friction teaching packet
        run: make archival-friction-packet

      - name: Rebuild contested-models teaching packet
        run: make contested-models-packet

      - name: Regenerate catalogues and translation report
        run: make indexes

      - name: Verify generated artefacts are committed
        run: git diff --exit-code

      - name: Validate and build
        run: make check

      - name: Verify all generated publication artefacts are committed
        run: git diff --exit-code

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
